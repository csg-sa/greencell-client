[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greencell_client"
dynamic = ["version"]
authors = [
  { name="Jakub Brzezowski", email="jakub.brzezowski@greencell.pl" },
]
description = "Support for communication with Greencell devices using by Home Assistant integration"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
greencell_client = ["py.typed"]

[tool.ruff]
line-length = 100

extend-exclude = ["src/greencell_client/_version.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Handled by `ruff format`; linting them too makes the two tools fight.
    "W191", "E111", "E114", "E117", "D206", "D300",
    "Q000", "Q001", "Q002", "Q003",
    "COM812", "COM819", "ISC001", "ISC002",

    # The module docstrings are reST: a title with an `=====` underline directly
    # beneath it, and `Example`/`Returns` are section *headings*, not Google-style
    # section labels. pydocstyle's summary-placement and section-structure rules
    # assume Google/NumPy style, and "fixing" them corrupts the Sphinx input --
    # it desynchronises underline lengths and appends colons to headings.
    # Docstring *presence* (D1xx) is still enforced.
    "D200", "D203", "D205", "D212", "D213",  # summary placement
    "D400", "D415",                          # summary must end in a period
    "D406", "D407", "D408", "D409", "D410",  # section structure
    "D411", "D412", "D413", "D414", "D416", "D417",

    # Renaming these would break callers that pass the argument by keyword.
    "N803",    # parse_3phase_msg(ThreePhaseData=...) is public API
    "FBT001",  # boolean positional argument in public API

    # Intentional typography in docstrings (en dash), not a homoglyph mistake.
    "RUF002",

    # Would require `from __future__ import annotations` across the package,
    # changing annotations to strings at runtime. Not worth it for a client lib.
    "FA100",


    # Style-only, high volume, no functional benefit.
    "EM101", "EM102", "TRY003",
]

[tool.ruff.lint.flake8-copyright]
# Matches the holder in LICENSE. Greencell is a trademark of csg-sa, so the
# copyright notice names the legal entity, not the brand.
author = "csg-sa"

[tool.ruff.lint.per-file-ignores]
# Enum machinery dictates these signatures: metaclass __new__ takes `metacls`,
# and _generate_next_value_ takes `name` first with three arguments it ignores.
# ANN401 likewise: EnumMeta.__new__ wants the private `enum._EnumDict` for
# `classdict`, so `Any` is the only annotation mypy --strict accepts here.
"src/greencell_client/utils.py" = ["N804", "N805", "ARG002", "ANN401"]
# The docstring documents `Raises: ValueError`; TypeError would break callers.
"src/greencell_client/topics.py" = ["TRY004"]
# Early returns are the clearest shape for a payload parser (7 > 6 allowed).
"src/greencell_client/mqtt_parser.py" = ["PLR0911"]
# Tests: asserts are the point, and mypy does not cover them.
"tests/**" = [
    "S101", "INP001", "D100", "D103",
    "ANN001", "ANN201", "ANN202",
    "PLR2004", "PT011",
]
# Release helper script: prints to stdout, asserts, not an importable package.
"ci/**" = ["S101", "INP001", "D100", "T201", "PTH207"]
# Sphinx dictates the module shape, including the `copyright` name.
"docs/conf.py" = ["INP001", "D100", "A001", "DTZ011", "PTH100"]

[tool.pylint.main]
# Generated by setuptools_scm at build time; same exclusion as ruff and mypy.
ignore-paths = ["src/greencell_client/_version\\.py"]

[tool.pylint."messages control"]
# Ruff runs with select = ["ALL"], which includes the pylint port (PL* rules),
# so pylint is kept to the checks ruff has no equivalent for -- notably
# duplicate-code and its inference-based checks. Anything ruff already decides
# is disabled here so exemptions live in exactly one place, above.
disable = [
    # Conflicts outright with ruff's TRY300: TRY300 requires the `return` to sit
    # in a try/else block, R1705 demands that same `else` be removed. Ruff wins.
    "no-else-return",

    # Docstring policy belongs to ruff's D1xx rules (incl. the tests/ci/docs
    # exemptions); enforcing it twice would mean two lists to keep in sync.
    "missing-module-docstring",
    "missing-function-docstring",

    # Naming belongs to ruff's N8xx / A001. Both already allow the public
    # `ThreePhaseData` argument names and Sphinx's lowercase conf.py globals.
    "invalid-name",
    "redefined-builtin",
    "bad-mcs-classmethod-argument",
    "no-self-argument",

    # Ruff's PLR0911, already scoped to the parser in per-file-ignores.
    "too-many-return-statements",

    # Fires on the enum helper classes, which exist to carry behaviour rather
    # than a public method surface. Ruff has no equivalent and we want none.
    "too-few-public-methods",
]

[tool.mypy]
strict = true
files = ["src/greencell_client"]

# Generated by setuptools_scm at build time, absent from a fresh checkout.
[[tool.mypy.overrides]]
module = "greencell_client._version"
ignore_missing_imports = true

[tool.setuptools_scm]
tag_regex = "^v?(?P<version>\\d+\\.\\d+\\.\\d+)$"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
write_to = "src/greencell_client/_version.py"
