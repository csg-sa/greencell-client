name: CI

on:
  push:
  pull_request:

env:
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  ruff:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pinned: `select = ["ALL"]` opts in to new rules as ruff adds them, so an
      # unpinned install would fail unrelated PRs whenever ruff releases.
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff==0.16.7'

      - name: Run ruff check
        run: ruff check --output-format=github src/ tests/ ci/ docs/

      - name: Run ruff format
        if: '!cancelled()'
        run: ruff format --check --diff src/ tests/ ci/ docs/

  mypy:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy

      - name: Run mypy
        run: mypy

  pytest:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: [ruff, mypy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'pyproject.toml', 'setup.cfg', 'setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          pip install -e .

      - name: Run pytest
        run: pytest tests/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: pytest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist & wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Inspect wheel METADATA
        run: |
          python ci/check_version.py

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
